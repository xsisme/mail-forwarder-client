name: Windows tests and EXE

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"

jobs:
  test:
    name: Windows tests / Python ${{ matrix.python }}
    runs-on: windows-2022
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install UI dependencies
        run: python -X utf8 -m pip install -r requirements.txt
      - name: Run all functional and Windows desktop tests
        run: python -X utf8 -m unittest discover -s tests -v
      - name: Verify source window startup
        run: python -X utf8 check_startup.py --data-dir .build-smoke
      - name: Preserve failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-test-logs-${{ matrix.python }}
          path: |
            .build-test-logs/**/startup.log
            .build-test-logs/**/ui-smoke-result.json
            .build-test-logs/**/forwarder.log
            .build-smoke/startup.log
            .build-smoke/ui-smoke-result.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  build:
    name: Build and verify Windows EXE
    needs: test
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt
      - name: Install build dependencies
        run: python -X utf8 -m pip install -r requirements-build.txt
      - name: Build standalone client
        run: python -X utf8 -m PyInstaller --clean --noconfirm --onefile --windowed --collect-all customtkinter --collect-all darkdetect --name MailForwarderClient app.py
      - name: Verify packaged window startup
        run: python -X utf8 check_startup.py --exe dist/MailForwarderClient.exe --data-dir .build-smoke-exe
      - name: Include account launchers
        run: Copy-Item start_account_A.bat,start_account_B.bat -Destination dist
      - name: Upload verified Windows package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: MailForwarderClient-Windows
          path: |
            dist/MailForwarderClient.exe
            dist/start_account_A.bat
            dist/start_account_B.bat
          if-no-files-found: error
          retention-days: 30
      - name: Preserve build failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-build-logs
          path: |
            .build-smoke-exe/startup.log
            .build-smoke-exe/ui-smoke-result.json
            build/MailForwarderClient/warn-MailForwarderClient.txt
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
